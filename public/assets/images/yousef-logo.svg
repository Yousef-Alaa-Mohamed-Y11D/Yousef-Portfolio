<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" fill="none" width="140" height="40">
  <defs>
    <linearGradient id="ylight_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="ylight_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ylight_silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <filter id="ylight_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Icon Mark: Modern Dev Shield -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#ylight_grad)" stroke="#292524" stroke-width="1.5"/>
  <rect x="4.5" y="4.5" width="31" height="31" rx="8" fill="none" stroke="#44403c" stroke-width="0.8" stroke-dasharray="2.5 2.5" opacity="0.5"/>
  
  <!-- Stylized Y mark in shield -->
  <path d="M12 12 L20 22" stroke="url(#ylight_silver)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 12 L20 22" stroke="url(#ylight_amber)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ylight_glow)"/>
  <path d="M20 22 L20 30" stroke="url(#ylight_silver)" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="28" cy="12" r="2.2" fill="#f59e0b"/>

  <!-- Text "Yousef" only -->
  <text x="47" y="27" fill="#1c1917" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.6px">Yousef</text>
  
  <!-- Terminal / .NET Accent Dot -->
  <circle cx="127" cy="24" r="3.2" fill="#f59e0b" filter="url(#ylight_glow)"/>
</svg>
