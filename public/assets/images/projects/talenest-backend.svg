<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#171412" />
  <rect x="40" y="40" width="720" height="370" rx="8" fill="#1f1a16" stroke="#332a24" stroke-width="1.5" />
  
  <rect x="40" y="40" width="720" height="44" rx="8" fill="#28221c" />
  <circle cx="68" cy="62" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="86" cy="62" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="104" cy="62" r="5" fill="#10b981" opacity="0.8" />
  <text x="400" y="67" fill="#fb923c" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle">TaleNest Media API / Channels &amp; Video Metadata Ingestion</text>

  <g transform="translate(65, 105)">
    <!-- Terminal Box -->
    <rect x="0" y="0" width="410" height="280" rx="6" fill="#120f0d" stroke="#332a24" />
    <text x="20" y="32" fill="#ea580c" font-family="'Fira Code', monospace" font-size="12.5" font-weight="600">$ curl -X GET "api/talenest/feeds/latest"</text>
    <text x="20" y="58" fill="#a8a29e" font-family="'Fira Code', monospace" font-size="11.5">HTTP/1.1 200 OK</text>
    <text x="20" y="78" fill="#a8a29e" font-family="'Fira Code', monospace" font-size="11.5">Content-Type: application/json; charset=utf-8</text>
    <text x="20" y="105" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12">{</text>
    <text x="35" y="128" fill="#fdba74" font-family="'Fira Code', monospace" font-size="11.5">  "channel": "TaleNest",</text>
    <text x="35" y="150" fill="#fdba74" font-family="'Fira Code', monospace" font-size="11.5">  "handle": "@elshawesh-AI",</text>
    <text x="35" y="172" fill="#fdba74" font-family="'Fira Code', monospace" font-size="11.5">  "status": "Healthy",</text>
    <text x="35" y="194" fill="#fdba74" font-family="'Fira Code', monospace" font-size="11.5">  "cachedEntries": 24,</text>
    <text x="35" y="216" fill="#fdba74" font-family="'Fira Code', monospace" font-size="11.5">  "responseTimeMs": 14.2</text>
    <text x="20" y="240" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12">}</text>
    <text x="20" y="265" fill="#22c55e" font-family="'Fira Code', monospace" font-size="11.5">✔ Pipeline verified in Docker container</text>

    <!-- Side stats -->
    <rect x="440" y="0" width="230" height="85" rx="6" fill="#26201a" stroke="#ea580c" stroke-width="1.2" />
    <text x="455" y="30" fill="#fed7aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">TaleNest Media Engine</text>
    <text x="455" y="55" fill="#a8a29e" font-family="'Fira Code', monospace" font-size="11">C# .NET 8 • SQL Server</text>
    <text x="455" y="72" fill="#22c55e" font-family="'Fira Code', monospace" font-size="11">YouTube API Integration</text>

    <rect x="440" y="100" width="230" height="85" rx="6" fill="#26201a" stroke="#332a24" />
    <text x="455" y="130" fill="#fed7aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Dockerized Service</text>
    <text x="455" y="155" fill="#a8a29e" font-family="'Fira Code', monospace" font-size="11">Multi-stage build</text>
    <text x="455" y="172" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11">Alpine Linux runtime</text>

    <rect x="440" y="200" width="230" height="80" rx="6" fill="#26201a" stroke="#332a24" />
    <text x="455" y="230" fill="#fed7aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">CI/CD Automation</text>
    <text x="455" y="255" fill="#a8a29e" font-family="'Fira Code', monospace" font-size="11">GitHub Actions workflow</text>
