  <text x="400" y="67" fill="#a1a1aa" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle">StudentHub.Api / Controllers / StudentsController.cs</text>
  
  <!-- Code & Architecture Diagram -->
  <!-- Left Side: Code Editor -->
  <rect x="65" y="105" width="370" height="280" rx="6" fill="#121215" stroke="#27272a" />
  <text x="85" y="135" fill="#d97706" font-family="'Fira Code', monospace" font-size="13" font-weight="600">[Authorize(Roles = "Admin,Registrar")]</text>
  <text x="85" y="160" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13">[HttpPost("enroll")]</text>
  <text x="85" y="185" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13">public async Task<text fill="#f8fafc">&lt;</text><text fill="#fbbf24">IActionResult</text><text fill="#f8fafc">&gt;</text></text>
  <text x="85" y="210" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13">EnrollStudent([FromBody] EnrollDto dto)</text>
  <text x="85" y="235" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13">{</text>
  <text x="105" y="260" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12.5">  var result = await _studentService</text>
  <text x="105" y="285" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12.5">    .ProcessEnrollmentAsync(dto);</text>
  <text x="105" y="310" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="12.5">  return Ok(result);</text>
  <text x="85" y="335" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13">}</text>

